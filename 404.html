<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — GetsU</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F5C34'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-weight='700' fill='%23FBF9F2' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#191F16;--ink-soft:#4A5540;--ink-faint:#79856C;
  --paper:#FBF9F2;--paper-raised:#F2EDDD;--line:#DCD3B4;
  --moss:#1F5C34;--on-moss:#FBF9F2;--turmeric:#D4A017;
  --font-display:'Iowan Old Style','Palatino Linotype','URW Palladio L','Book Antiqua',Georgia,'Noto Serif',serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  --font-mono:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono','Courier New',monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#EFEDDF;--ink-soft:#BAC5A9;--ink-faint:#829073;
  --paper:#101408;--paper-raised:#181E10;--line:#303B24;
  --moss:#63C878;--on-moss:#101408;--turmeric:#EFC15C;
}}
:root[data-theme="dark"]{
  --ink:#EFEDDF;--ink-soft:#BAC5A9;--ink-faint:#829073;
  --paper:#101408;--paper-raised:#181E10;--line:#303B24;
  --moss:#63C878;--on-moss:#101408;--turmeric:#EFC15C;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);
  min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:2rem;line-height:1.65}
.wrap{max-width:520px;text-align:center}
.code{font-family:var(--font-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--turmeric);margin-bottom:1.25rem}
h1{font-family:var(--font-display);font-size:clamp(1.9rem,5vw,2.6rem);letter-spacing:-.02em;margin-bottom:1rem;text-wrap:balance}
p{color:var(--ink-soft);font-size:17px;margin-bottom:2rem;text-wrap:balance}
.actions{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:.875rem 1.75rem;
  border-radius:5px;font-weight:600;font-size:14px;text-decoration:none;border:1.5px solid transparent;
  transition:background .25s ease,border-color .25s ease,color .25s ease}
.btn-primary{background:var(--moss);color:var(--on-moss)}
.btn-primary:hover{filter:brightness(.92)}
.btn-secondary{background:var(--paper-raised);color:var(--ink);border-color:var(--line)}
.btn-secondary:hover{border-color:var(--moss);color:var(--moss)}
:focus-visible{outline:2px solid var(--moss);outline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
  <div class="code">Error 404</div>
  <h1>This page isn't on the shelf</h1>
  <p>The link may be old, or the page may have moved. The shop is still where you left it.</p>
  <div class="actions">
    <a class="btn btn-primary" href="/GetsU-/#products">Go to the shop</a>
    <a class="btn btn-secondary" href="/GetsU-/">Back to home</a>
  </div>
</div>
</body>
</html>
